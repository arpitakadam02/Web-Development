<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment No 6 </title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        
        h1 {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 0;
        }

        
        h2 {
            color: #333;
            margin-top: 10px;
        }

    
        .iframe-container {
            display: inline-block;
            margin: 20px;
            padding: 10px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        
        iframe {
            width: 100%;
            max-width: 800px;
            height: 400px;
            border: none;
            border-radius: 8px;
        }

        
        .iframe-container h3 {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }

        
        @media screen and (max-width: 768px) {
            iframe {
                max-width: 100%;
            }

            .iframe-container {
                width: 90%;
            }
        }
    </style>
</head>
<body>

<h1>Assignment No 6</h1>
<h2>Webpage Using HTML Frames</h2>

<p>Displaying images of beautiful tourist destinations!</p>


<div class="iframe-container">
    <h3>Sunrise</h3>
    <iframe src="sunrise.jpg" title="Sunrise Image"></iframe>
</div>


<div class="iframe-container">
    <h3>Sunset</h3>
    <iframe src="sunset.jpg" title="Sunset Image"></iframe>
</div>

<div class="iframe-container">
    <h3>Kashmir</h3>
    <iframe src="kashmir.jpg" title="Kashmir Image"></iframe>
</div>


<div class="iframe-container">
    <h3>ooty</h3>
    <iframe src="ooty.jpg" title="Ooty Image"></iframe>
</div>


<div class="iframe-container">
    <h3>kerala</h3>
    <iframe src="kerala.jpg" title="Kerala Image"></iframe>
</div>


<div class="iframe-container">
    <h3>Deharadun</h3>
    <iframe src="deharadun.jpg" title="Deharadun Image"></iframe>
</div>

</body>
</html>
