<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <h1>Assignment No:9</h1>
  <title>Complete Employee Registration Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #e0f7fa, #fffde7);
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: #fff;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    h2 {
      text-align: center;
      color: #006064;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }
    .checkbox-group {
      margin-top: 10px;
    }
    input[type="submit"] {
      background-color: #00796b;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      margin-top: 25px;
      transition: background-color 0.3s;
    }
    input[type="submit"]:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Employee Registration Form</h2>
  <form action="#" method="post">
    
    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="firstname" required>

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lastname" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>

    <label for="mother">Mother's Name:</label>
    <input type="text" id="mother" name="mother" required>

    <label for="father">Father's Name:</label>
    <input type="text" id="father" name="father" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="country">Country:</label>
    <select id="country" name="country" required>
      <option value="">Select Country</option>
      <option value="India">India</option>
      <option value="USA">USA</option>
      <option value="Canada">Canada</option>
      <option value="UK">United Kingdom</option>
      <option value="Other">Other</option>
    </select>

    <label>Hobbies:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
      <label><input type="checkbox" name="hobbies" value="Traveling"> Traveling</label>
      <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
      <label><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
    </div>

    <label for="address">Address:</label>
    <textarea id="address" name="address" rows="3" required></textarea>

    <label for="dept">Department:</label>
    <input type="text" id="dept" name="department" required>

    <label for="position">Position:</label>
    <input type="text" id="position" name="position" required>

    <input type="submit" value="Register">
  </form>
</div>

</body>
</html>
