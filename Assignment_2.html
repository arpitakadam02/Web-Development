<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Web Page with CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        section {
            background: white;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        ul {
            list-style-type: square;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Static Web Page</h1>
</header>

<main>
    <section>
        <h2>About</h2>
        <p>This is a simple static web page created using HTML and CSS. It looks cleaner and more professional with some styling.</p>
    </section>

    <section>
        <h2>Topics Covered</h2>
        <ul>
            <li>HTML Basics</li>
            <li>CSS Introduction</li>
            <li>XML Overview</li>
        </ul>
    </section>

    <section>
        <h2>Contact</h2>
        <p>Email: example@email.com</p>
    </section>
</main>

<footer>
    &copy; 2025 My Static Website
</footer>

</body>
</html>
